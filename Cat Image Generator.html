<html> 
<head> 
<title>Cat Image Generator</title> 
<style> 
body{ 
font-family: Verdana; 
text-align: center; 
margin-top: 60px; 
background-color: #fff0f5; 
} 
h1{ 
color: #444; 
} 
button{ 
padding: 10px 20px; 
font-size: 14px; 
cursor: pointer; 
background-color: #ff69b4; 
color: white; 
border: none; 
border-radius: 20px; 
} 
button:hover{ 
background-color: #ff1493; 
} 
#content{ 
margin-top:25px; 
} 
.card{ 
display:inline-block; 
padding:15px; 
border:1px solid #ccc; 
border-radius:12px; 
background-color: white; 
} 
img{ 
max-width: 300px; 
border-radius: 10px; 
} 
</style> 
</head> 
<body> 
<h1>Cat Image Generator</h1> 
<button onclick="getCat()">Click here for your Cat image</button> 
<div id="content"></div> 
<script> 
async function getCat() 
{ 
try 
{ 
// Fetch data from API 
let response = await fetch("https://api.thecatapi.com/v1/images/search"); 
// Convert to JSON 
let data = await response.json(); 
// Access image 
let cat = data[0].url; 
document.getElementById("content").innerHTML = 
`<div class="card"> 
<img src="${cat}"> 
</div>`; 
} 
catch(error) 
{ 
console.log("Error fetching data", error); 
} 
} 
</script> 
</body> 
</html>
